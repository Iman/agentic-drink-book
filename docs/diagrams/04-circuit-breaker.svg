<svg xmlns="http://www.w3.org/2000/svg" version="1.1" data-diagram-type="STATE" style="width:1199px;height:634px;background:#FFFFFF;" width="1199px" height="634px" viewBox="0 0 1199 634" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css" role="img" aria-labelledby="04-circuit-breaker-title 04-circuit-breaker-desc"><title id="04-circuit-breaker-title">Circuit state, deadlines and traffic admission</title><desc id="04-circuit-breaker-desc">Circuit state, deadlines and traffic admission. Boundaries describe application responsibilities; model judgments remain fallible.</desc><defs /><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="434.013" y="23.535" fill="#000" font-size="14" textLength="324.133" font-weight="700">Circuit state, deadlines and traffic admission</text></g><g class="entity" data-qualified-name="Closed" id="04-circuit-breaker-ent0001" data-source-line="4"><rect x="526.86" y="125.378" width="287.306" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><line x1="526.86" y1="151.867" x2="814.166" y2="151.867" style="stroke:#181818;stroke-width:0.5;" /><text x="647.472" y="143.913" fill="#000" font-size="14" textLength="46.081">Closed</text><text x="531.86" y="170.402" fill="#000" font-size="14" textLength="229.264">Calls admitted subject to capacity</text><text x="531.86" y="186.89" fill="#000" font-size="14" textLength="267.306">Healthy completion resets failure count</text></g><g class="entity" data-qualified-name="Open" id="04-circuit-breaker-ent0002" data-source-line="7"><rect x="332.88" y="272.728" width="239.276" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><line x1="332.88" y1="299.217" x2="572.156" y2="299.217" style="stroke:#181818;stroke-width:0.5;" /><text x="434.43" y="291.263" fill="#000" font-size="14" textLength="36.176">Open</text><text x="337.88" y="317.752" fill="#000" font-size="14" textLength="219.276">Reject calls without provider I/O</text><text x="337.88" y="334.24" fill="#000" font-size="14" textLength="181.022">Monotonic cooldown clock</text></g><g class="entity" data-qualified-name="HalfOpen" id="04-circuit-breaker-ent0003" data-source-line="10"><rect x="540.92" y="427.738" width="203.189" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><line x1="540.92" y1="454.227" x2="744.109" y2="454.227" style="stroke:#181818;stroke-width:0.5;" /><text x="610.82" y="446.273" fill="#000" font-size="14" textLength="63.39">HalfOpen</text><text x="545.92" y="472.762" fill="#000" font-size="14" textLength="183.189">Exactly one recovery probe</text><text x="545.92" y="489.25" fill="#000" font-size="14" textLength="129.691">Reject other callers</text></g><g class="start_entity" data-qualified-name=".start." id="04-circuit-breaker-ent0004" data-source-line="3"><ellipse cx="670.51" cy="53.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;" /></g><g class="entity" data-qualified-name="GMN10" id="04-circuit-breaker-ent0011" data-source-line="15"><path d="M848.88,124.488 L848.88,156.108 L814.46,160.108 L848.88,164.108 L848.88,195.73 A0,0 0 0 0 848.88,195.73 L1184.159,195.73 A0,0 0 0 0 1184.159,195.73 L1184.159,134.488 L1174.159,124.488 L848.88,124.488 A0,0 0 0 0 848.88,124.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M1174.159,124.488 L1174.159,134.488 L1184.159,134.488 L1174.159,124.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="854.88" y="142.057" fill="#000" font-size="13" textLength="216.963">Every call has an asyncio deadline.</text><text x="854.88" y="157.367" fill="#000" font-size="13" textLength="260.571">Slow completed responses are discarded.</text><text x="854.88" y="172.678" fill="#000" font-size="13" textLength="301.564">Transport, schema and response failures count.</text><text x="854.88" y="187.988" fill="#000" font-size="13" textLength="314.279">Policy rejection and busy admission do not count.</text></g><g class="entity" data-qualified-name="GMN13" id="04-circuit-breaker-ent0014" data-source-line="21"><path d="M6,419.198 L6,505.751 L403.029,505.751 L403.029,429.198 L393.029,419.198 L6,419.198" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M393.029,419.198 L393.029,429.198 L403.029,429.198 L393.029,419.198" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD" /><text x="12" y="436.767" fill="#000" font-size="13" textLength="292.151">An epoch prevents a late success from closing</text><text x="12" y="452.077" fill="#000" font-size="13" textLength="220.93">a circuit tripped by a newer failure.</text><text x="12" y="467.388" fill="#000" font-size="13" textLength="369.935">Shared specialist generation circuit; separate judge circuit.</text><text x="12" y="482.698" fill="#000" font-size="13" textLength="376.029">Evaluation auditor has its own circuit and one in-flight slot.</text><text x="12" y="498.009" fill="#000" font-size="13" textLength="288.698">No retries or alternate-provider data transfer.</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="04-circuit-breaker-lnk5" data-source-line="3" data-link-type="dependency"><path d="M670.51,63.768 C670.51,77.478 670.51,98.818 670.51,120.338" style="stroke:#181818;stroke-width:1;" fill="none" id="04-circuit-breaker-*start*-to-Closed" /><polygon points="670.51,125.338,674.51,116.338,670.51,120.338,666.51,116.338,670.51,125.338" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="04-circuit-breaker-lnk6" data-source-line="6" data-link-type="dependency"><path d="M619.4,195.188 C584.54,218.428 542.71,246.325 507.84,269.575" style="stroke:#181818;stroke-width:1;" fill="none" id="04-circuit-breaker-Closed-to-Open" /><polygon points="503.68,272.348,513.387,270.684,507.84,269.575,508.949,264.027,503.68,272.348" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="569.05" y="239.297" fill="#000" font-size="13" textLength="158.336">failure threshold reached</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="04-circuit-breaker-lnk7" data-source-line="9" data-link-type="dependency"><path d="M561.93,342.638 C577.11,350.658 591.57,360.398 603.51,372.198 C618.68,387.168 626.822,404.271 632.752,422.611" style="stroke:#181818;stroke-width:1;" fill="none" id="04-circuit-breaker-Open-to-HalfOpen" /><polygon points="634.29,427.368,635.327,417.574,632.752,422.611,627.715,420.035,634.29,427.368" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="617.62" y="385.767" fill="#000" font-size="13" textLength="222.124">cooldown elapsed; first eligible call</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="04-circuit-breaker-lnk9" data-source-line="13" data-link-type="dependency"><path d="M540.59,441.878 C502.88,434.678 459.76,426.498 420.51,419.198 C383.88,412.378 279.39,417.808 255.51,389.198 C224.96,352.588 270.31,333.324 327.7,322.274" style="stroke:#181818;stroke-width:1;" fill="none" id="04-circuit-breaker-HalfOpen-to-Open" /><polygon points="332.61,321.328,323.016,319.102,327.7,322.274,324.529,326.958,332.61,321.328" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="256.51" y="385.767" fill="#000" font-size="13" textLength="338.793">failure, slowness, timeout, cancellation or no capacity</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="04-circuit-breaker-lnk8" data-source-line="12" data-link-type="dependency"><path d="M744.38,450.748 C783.54,441.088 824.57,422.978 848.51,389.198 C898.7,318.408 804.324,241.973 734.884,198.003" style="stroke:#181818;stroke-width:1;" fill="none" id="04-circuit-breaker-HalfOpen-to-Closed" /><polygon points="730.66,195.328,736.124,203.523,734.884,198.003,740.404,196.764,730.66,195.328" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="862.68" y="312.527" fill="#000" font-size="13" textLength="238.24">probe healthy and within latency limit</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0014" id="04-circuit-breaker-lnk15" data-source-line="21" data-link-type="association"><path d="M332.63,323.848 C298.88,333.208 264.37,348.198 238.51,372.198 C225.26,384.498 217.13,402.508 212.17,419.138" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="04-circuit-breaker-Open-GMN13" /></g><g class="legend" data-source-line="27"><rect x="360.179" y="526.751" width="471.802" height="75.953" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5" /><text x="365.179" y="545.286" fill="#000" font-size="14" textLength="396.402">1. ContextStore: per-owner rate and one turn per session.</text><text x="365.179" y="561.774" fill="#000" font-size="14" textLength="375.095">2. Chatbot: global in-flight turn cap, no waiting queue.</text><text x="365.179" y="578.263" fill="#000" font-size="14" textLength="461.802">3. CircuitBreaker: role capacity, deadline, slow threshold, cooldown.</text><text x="365.179" y="594.751" fill="#000" font-size="14" textLength="451.801">All controls are process-local, not distributed traffic management.</text></g><g class="footer" data-source-line="33"><text x="432.698" y="625.372" fill="#888" font-size="10" textLength="326.763">Agentic Drink Book | Policy 2.1.0 | Model judgments remain fallible</text></g></g></svg>
