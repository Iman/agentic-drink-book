<svg xmlns="http://www.w3.org/2000/svg" version="1.1" data-diagram-type="DESCRIPTION" style="width:1642px;height:1033px;background:#FFFFFF;" width="1642px" height="1033px" viewBox="0 0 1642 1033" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css" role="img" aria-labelledby="14-l1-runtime-components-title 14-l1-runtime-components-desc"><title id="14-l1-runtime-components-title">L1 components: entry points, host authority and model access</title><desc id="14-l1-runtime-components-desc">L1 components: entry points, host authority and model access. Boundaries describe application responsibilities; model judgments remain fallible.</desc><defs /><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="593.069" y="23.535" fill="#000" font-size="14" textLength="448.861" font-weight="700">L1 components: entry points, host authority and model access</text></g><g class="cluster" data-qualified-name="Python application modules . logical boundaries" id="14-l1-runtime-components-ent0002" data-source-line="6"><rect x="7" y="176.958" width="1621" height="509.63" fill="#E8F0FA" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5" /><text x="642.001" y="192.493" fill="#000" font-size="14" textLength="350.998" font-weight="700">Python application modules / logical boundaries</text></g><g class="cluster" data-qualified-name="Python application modules . logical boundaries.Code-owned authority" id="14-l1-runtime-components-ent0005" data-source-line="9"><rect x="539" y="219.958" width="434" height="442.63" fill="#EDF7ED" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5" /><text x="674.184" y="235.493" fill="#000" font-size="14" textLength="163.632" font-weight="700">Code-owned authority</text></g><g class="entity" data-qualified-name="Python application modules . logical boundaries.web" id="14-l1-runtime-components-ent0003" data-source-line="7"><rect x="988.86" y="254.958" width="268.274" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="998.86" y="278.493" fill="#000" font-size="14" textLength="128.051">FastAPI entry point</text><text x="998.86" y="294.982" fill="#000" font-size="14" textLength="47.954">web.py</text><text x="998.86" y="311.47" fill="#000" font-size="14" textLength="248.274">Host, Origin, JSON and locale checks</text></g><g class="entity" data-qualified-name="Python application modules . logical boundaries.cli" id="14-l1-runtime-components-ent0004" data-source-line="8"><rect x="1292.29" y="254.958" width="319.428" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="1302.29" y="278.493" fill="#000" font-size="14" textLength="138.975">Terminal entry point</text><text x="1302.29" y="294.982" fill="#000" font-size="14" textLength="35.82">cli.py</text><text x="1302.29" y="311.47" fill="#000" font-size="14" textLength="299.428">host-created principal and operator options</text></g><g class="entity" data-qualified-name="Python application modules . logical boundaries.adapter" id="14-l1-runtime-components-ent0009" data-source-line="14"><rect x="87.87" y="564.378" width="378.251" height="85.953" fill="#FBE9E4" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="97.87" y="587.913" fill="#000" font-size="14" textLength="188.938">LangChain provider adapter</text><text x="97.87" y="604.402" fill="#000" font-size="14" textLength="189.273">providers.py + resilience.py</text><text x="97.87" y="620.89" fill="#000" font-size="14" textLength="358.251">shared specialist circuit / judge circuit / audit circuit</text><text x="97.87" y="637.378" fill="#000" font-size="14" textLength="301.178">deadlines, capacity and strict model outputs</text></g><g class="entity" data-qualified-name="Python application modules . logical boundaries.evaluation" id="14-l1-runtime-components-ent0010" data-source-line="15"><rect x="22.72" y="401.418" width="394.568" height="85.953" fill="#F3EAF6" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="32.72" y="424.953" fill="#000" font-size="14" textLength="148.613">Evaluation entry point</text><text x="32.72" y="441.442" fill="#000" font-size="14" textLength="186.895">evaluation.py + auditing.py</text><text x="32.72" y="457.93" fill="#000" font-size="14" textLength="374.568">synthetic fixtures and independent expected outcomes</text><text x="32.72" y="474.418" fill="#000" font-size="14" textLength="358.887">optional post-run auditor; validated metadata report</text></g><g class="entity" data-qualified-name="Python application modules . logical boundaries.Code-owned authority.graph" id="14-l1-runtime-components-ent0006" data-source-line="10"><rect x="554.64" y="401.418" width="402.724" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="564.64" y="424.953" fill="#000" font-size="14" textLength="140">LangGraph workflow</text><text x="564.64" y="441.442" fill="#000" font-size="14" textLength="82.435">workflow.py</text><text x="564.64" y="457.93" fill="#000" font-size="14" textLength="382.724">input review -&gt; mixing OR production -&gt; output review</text><text x="564.64" y="474.418" fill="#000" font-size="14" textLength="357.684">code validates evidence and commits accepted turns</text></g><g class="entity" data-qualified-name="Python application modules . logical boundaries.Code-owned authority.context" id="14-l1-runtime-components-ent0007" data-source-line="11"><path d="M607.61,578.118 C607.61,568.118 755.997,568.118 755.997,568.118 C755.997,568.118 904.383,568.118 904.383,578.118 L904.383,636.583 C904.383,646.583 755.997,646.583 755.997,646.583 C755.997,646.583 607.61,646.583 607.61,636.583 L607.61,578.118" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1" /><path d="M607.61,578.118 C607.61,588.118 755.997,588.118 755.997,588.118 C755.997,588.118 904.383,588.118 904.383,578.118" style="stroke:#181818;stroke-width:0.5;" fill="none" /><text x="617.61" y="605.653" fill="#000" font-size="14" textLength="88.737">ContextStore</text><text x="617.61" y="622.142" fill="#000" font-size="14" textLength="71.873">context.py</text><text x="617.61" y="638.63" fill="#000" font-size="14" textLength="276.773">owner, tenant, readers, TTL and capacity</text></g><g class="entity" data-qualified-name="Python application modules . logical boundaries.Code-owned authority.policy" id="14-l1-runtime-components-ent0008" data-source-line="12"><path d="M575.72,257.458 L575.72,321.923 A2.5,2.5 0 0 0 578.22,324.423 L889.783,324.423 A2.5,2.5 0 0 0 892.283,321.923 L892.283,264.958 L882.283,254.958 L578.22,254.958 A2.5,2.5 0 0 0 575.72,257.458" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1" /><path d="M882.283,254.958 L882.283,262.458 A2.5,2.5 0 0 0 884.783,264.958 L892.283,264.958" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1" /><text x="585.72" y="278.493" fill="#000" font-size="14" textLength="93.393">Startup policy</text><text x="585.72" y="294.982" fill="#000" font-size="14" textLength="153.638">policy.py + policy.json</text><text x="585.72" y="311.47" fill="#000" font-size="14" textLength="296.563">strict schemas, rules, thresholds and digest</text></g><g class="entity" data-qualified-name="browser" id="14-l1-runtime-components-ent0001" data-source-line="5"><rect x="966" y="44.488" width="313.993" height="69.465" fill="#F6EBDC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="976" y="68.023" fill="#000" font-size="14" textLength="137.231">React browser client</text><text x="976" y="84.512" fill="#000" font-size="14" textLength="159.154">English / Persian + RTL</text><text x="976" y="101" fill="#000" font-size="14" textLength="293.993">plain-text replies, session cookie and CSRF</text></g><g class="entity" data-qualified-name="provider" id="14-l1-runtime-components-ent0011" data-source-line="17"><polygon points="136.33,759.588,146.33,749.588,417.68,749.588,417.68,819.053,407.68,829.053,136.33,829.053,136.33,759.588" fill="#FBE9E4" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="407.68" y1="759.588" x2="417.68" y2="749.588" style="stroke:#181818;stroke-width:0.5;" /><line x1="136.33" y1="759.588" x2="407.68" y2="759.588" style="stroke:#181818;stroke-width:0.5;" /><line x1="407.68" y1="759.588" x2="407.68" y2="829.053" style="stroke:#181818;stroke-width:0.5;" /><text x="151.33" y="783.123" fill="#000" font-size="14" textLength="154.321">Selected model service</text><text x="151.33" y="799.612" fill="#000" font-size="14" textLength="218.203">loopback Ollama OR OpenAI API</text><text x="151.33" y="816.1" fill="#000" font-size="14" textLength="241.35">all model output remains untrusted</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="14-l1-runtime-components-lnk12" data-source-line="18" data-link-type="dependency"><path d="M1123,114.178 C1123,152.948 1123,210.988 1123,249.748" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-browser-to-web" /><polygon points="1123,254.748,1127,245.748,1123,249.748,1119,245.748,1123,254.748" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="1124" y="157.527" fill="#000" font-size="13" textLength="78.971">HTTP / JSON</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" id="14-l1-runtime-components-lnk13" data-source-line="19" data-link-type="dependency"><path d="M1041.09,324.768 C987.01,347.268 920.356,375.007 862.606,399.037" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-web-to-graph" /><polygon points="857.99,400.958,867.836,401.194,862.606,399.037,864.763,393.808,857.99,400.958" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="962.47" y="367.987" fill="#000" font-size="13" textLength="99.309">HOST CONTEXT</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="14-l1-runtime-components-lnk14" data-source-line="20" data-link-type="dependency"><path d="M1296.24,324.868 C1193.75,347.348 1063.744,375.877 954.384,399.867" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-cli-to-graph" /><polygon points="949.5,400.938,959.148,402.917,954.384,399.867,957.434,395.103,949.5,400.938" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="1146.67" y="367.987" fill="#000" font-size="13" textLength="99.309">HOST CONTEXT</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="14-l1-runtime-components-lnk15" data-source-line="21" data-link-type="dependency"><path d="M756,487.688 C756,512.458 756,538.518 756,562.648" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-graph-to-context" /><polygon points="756,567.648,760,558.648,756,562.648,752,558.648,756,567.648" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="757" y="530.947" fill="#000" font-size="13" textLength="93.279">OWNER CHECK</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0006" id="14-l1-runtime-components-lnk16" data-source-line="22" data-link-type="dependency"><path d="M738.53,324.878 C740.47,339.258 742.79,356.158 745,371.418 C746.39,381.058 747.185,386.466 748.675,396.226" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-policy-to-graph" /><polygon points="749.43,401.168,752.026,391.668,748.675,396.226,744.118,392.875,749.43,401.168" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="746" y="367.987" fill="#000" font-size="13" textLength="100.299">ENFORCE RULES</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" id="14-l1-runtime-components-lnk17" data-source-line="23" data-link-type="dependency"><path d="M618.97,324.868 C543.21,347.368 448.263,375.585 367.463,399.585" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-policy-to-evaluation" /><polygon points="362.67,401.008,372.436,402.28,367.463,399.585,370.159,394.611,362.67,401.008" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="508.77" y="367.987" fill="#000" font-size="13" textLength="80.615">EVAL POLICY</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" id="14-l1-runtime-components-lnk18" data-source-line="24" data-link-type="dependency"><path d="M629.84,487.788 C559.85,511.308 477.82,538.876 407.84,562.386" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-graph-to-adapter" /><polygon points="403.1,563.978,412.905,564.904,407.84,562.386,410.358,557.32,403.1,563.978" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="531.86" y="530.947" fill="#000" font-size="13" textLength="83.027">THREE CALLS</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0006" id="14-l1-runtime-components-lnk19" data-source-line="25" data-link-type="dependency"><path d="M417.68,444.398 C462.29,444.398 504.69,444.398 549.45,444.398" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="14-l1-runtime-components-evaluation-to-graph" /><polygon points="554.45,444.398,545.45,440.398,549.45,444.398,545.45,448.398,554.45,444.398" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="435.46" y="437.967" fill="#000" font-size="13" textLength="101.429">SYNTHETIC RUN</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0009" id="14-l1-runtime-components-lnk20" data-source-line="26" data-link-type="dependency"><path d="M234.98,487.688 C243.32,511.248 252.01,535.785 260.36,559.355" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="14-l1-runtime-components-evaluation-to-adapter" /><polygon points="262.03,564.068,262.795,554.249,260.36,559.355,255.254,556.921,262.03,564.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="251.21" y="530.947" fill="#000" font-size="13" textLength="108.646">OPTIONAL AUDIT</text></g><g class="link" data-entity-1="ent0009" data-entity-2="ent0011" id="14-l1-runtime-components-lnk21" data-source-line="27" data-link-type="dependency"><path d="M277,650.548 C277,680.358 277,715.038 277,744.158" style="stroke:#181818;stroke-width:1;" fill="none" id="14-l1-runtime-components-adapter-to-provider" /><polygon points="277,749.158,281,740.158,277,744.158,273,740.158,277,749.158" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="278" y="716.157" fill="#000" font-size="13" textLength="80.952">MODEL CALL</text></g><g class="legend" data-source-line="28"><rect x="515.479" y="860.053" width="604.043" height="141.906" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5" /><text x="520.479" y="878.588" fill="#000" font-size="14" textLength="558.257">Four runtime LLM roles; code controls routing, output release and memory writes.</text><text x="520.479" y="895.077" fill="#000" font-size="14" textLength="469.41">Boxes describe code responsibilities, not separate deployed services.</text><text x="520.479" y="911.565" fill="#000" font-size="14" textLength="594.043">Web, terminal and evaluation are alternative entry points using the same core modules.</text><text x="520.479" y="928.053" fill="#000" font-size="14" textLength="585.635">Evaluation uses its own state and clients; the audit-fixture suite calls only the auditor.</text><text x="520.479" y="944.541" fill="#000" font-size="14" textLength="544.646">The auditor cannot change policy, expected labels or completed chat outcomes.</text><text x="520.479" y="961.03" fill="#000" font-size="14" textLength="494.799">Provider, policy and credentials come from the operator, never chat text.</text><text x="520.479" y="977.518" fill="#000" font-size="14" textLength="547.019">Solid arrows: runtime calls or policy input. Dashed arrows: evaluation-only calls.</text><text x="520.479" y="994.006" fill="#000" font-size="14" textLength="582.408">L1 expands the application from L0 (13); detailed safety boundaries are in 07 and 08.</text></g><g class="footer" data-source-line="38"><text x="654.119" y="1024.627" fill="#888" font-size="10" textLength="326.763">Agentic Drink Book | Policy 2.1.0 | Model judgments remain fallible</text></g></g></svg>
