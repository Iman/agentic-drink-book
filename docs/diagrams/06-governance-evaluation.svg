1019.088" style="stroke:#181818;stroke-width:1;" /><line x1="548.763" y1="1019.088" x2="389.954" y2="1019.088" style="stroke:#181818;stroke-width:1;" /><polygon points="399.954,1015.088,389.954,1019.088,399.954,1023.088,395.954,1019.088" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="377.954" y1="844.689" x2="377.954" y2="864.689" style="stroke:#181818;stroke-width:1;" /><polygon points="373.954,854.689,377.954,864.689,381.954,854.689,377.954,858.689" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="662.055" y1="390.195" x2="377.954" y2="390.195" style="stroke:#181818;stroke-width:1;" /><line x1="377.954" y1="390.195" x2="377.954" y2="412.195" style="stroke:#181818;stroke-width:1;" /><polygon points="373.954,402.195,377.954,412.195,381.954,402.195,377.954,406.195" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="794.078" y1="390.195" x2="1078.179" y2="390.195" style="stroke:#181818;stroke-width:1;" /><line x1="1078.179" y1="390.195" x2="1078.179" y2="412.195" style="stroke:#181818;stroke-width:1;" /><polygon points="1074.179,402.195,1078.179,412.195,1082.179,402.195,1078.179,406.195" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="377.954" y1="1031.088" x2="377.954" y2="1049.088" style="stroke:#181818;stroke-width:1;" /><line x1="377.954" y1="1049.088" x2="716.066" y2="1049.088" style="stroke:#181818;stroke-width:1;" /><polygon points="706.066,1045.088,716.066,1049.088,706.066,1053.088,710.066,1049.088" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="1078.179" y1="446.328" x2="1078.179" y2="1049.088" style="stroke:#181818;stroke-width:1;" /><line x1="1078.179" y1="1049.088" x2="740.066" y2="1049.088" style="stroke:#181818;stroke-width:1;" /><polygon points="750.066,1045.088,740.066,1049.088,750.066,1053.088,746.066,1049.088" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="728.066" y1="354.951" x2="728.066" y2="378.195" style="stroke:#181818;stroke-width:1;" /><polygon points="724.066,368.195,728.066,378.195,732.066,368.195,728.066,372.195" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="728.066" y1="1061.088" x2="728.066" y2="1081.088" style="stroke:#181818;stroke-width:1;" /><polygon points="724.066,1071.088,728.066,1081.088,732.066,1071.088,728.066,1075.088" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><g class="legend" data-source-line="47"><rect x="348.901" y="1124.088" width="569.897" height="75.953" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5" /><text x="353.901" y="1142.623" fill="#000" font-size="14" textLength="460.605">Implemented: policy validation/digest, tests, scenario expectations,</text><text x="353.901" y="1159.111" fill="#000" font-size="14" textLength="475.446">live evaluation report, bounded metadata log, and optional LLM audit.</text><text x="353.901" y="1175.6" fill="#000" font-size="14" textLength="469.185">Operational procedure: signing, review, canary, monitoring, rollback.</text><text x="353.901" y="1192.088" fill="#000" font-size="14" textLength="559.897">Public source repository exists; no production deployment pipeline is provisioned.</text></g><g class="footer" data-source-line="53"><text x="470.469" y="1222.709" fill="#888" font-size="10" textLength="326.763">Agentic Drink Book | Policy 2.1.0 | Model judgments remain fallible</text></g></g></svg>
