<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1098px;height:606px;background:#FFFFFF;" width="1098px" height="606px" viewBox="0 0 1098 606" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="383.543" y="23.535" fill="#000" font-size="14" textLength="324.133" font-weight="700">Circuit state, deadlines and traffic admission</text></g><g class="entity" data-qualified-name="Closed" id="ent0001" data-source-line="4"><rect x="425.92" y="125.378" width="287.306" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="425.92" y1="151.867" x2="713.226" y2="151.867" style="stroke:#181818;stroke-width:0.5;"/><text x="546.532" y="143.913" fill="#000" font-size="14" textLength="46.081">Closed</text><text x="430.92" y="170.402" fill="#000" font-size="14" textLength="229.264">Calls admitted subject to capacity</text><text x="430.92" y="186.89" fill="#000" font-size="14" textLength="267.306">Healthy completion resets failure count</text></g><g class="entity" data-qualified-name="Open" id="ent0002" data-source-line="7"><rect x="251.94" y="272.728" width="239.276" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="251.94" y1="299.217" x2="491.216" y2="299.217" style="stroke:#181818;stroke-width:0.5;"/><text x="353.49" y="291.263" fill="#000" font-size="14" textLength="36.176">Open</text><text x="256.94" y="317.752" fill="#000" font-size="14" textLength="219.276">Reject calls without provider I/O</text><text x="256.94" y="334.24" fill="#000" font-size="14" textLength="181.022">Monotonic cooldown clock</text></g><g class="entity" data-qualified-name="HalfOpen" id="ent0003" data-source-line="10"><rect x="419.98" y="420.088" width="203.189" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="419.98" y1="446.577" x2="623.169" y2="446.577" style="stroke:#181818;stroke-width:0.5;"/><text x="489.88" y="438.623" fill="#000" font-size="14" textLength="63.39">HalfOpen</text><text x="424.98" y="465.112" fill="#000" font-size="14" textLength="183.189">Exactly one recovery probe</text><text x="424.98" y="481.6" fill="#000" font-size="14" textLength="129.691">Reject other callers</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="3"><ellipse cx="569.58" cy="53.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="15"><path d="M747.94,124.488 L747.94,156.108 L713.52,160.108 L747.94,164.108 L747.94,195.73 A0,0 0 0 0 747.94,195.73 L1083.219,195.73 A0,0 0 0 0 1083.219,195.73 L1083.219,134.488 L1073.219,124.488 L747.94,124.488 A0,0 0 0 0 747.94,124.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1073.219,124.488 L1073.219,134.488 L1083.219,134.488 L1073.219,124.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="753.94" y="142.057" fill="#000" font-size="13" textLength="216.963">Every call has an asyncio deadline.</text><text x="753.94" y="157.367" fill="#000" font-size="13" textLength="260.571">Slow completed responses are discarded.</text><text x="753.94" y="172.678" fill="#000" font-size="13" textLength="301.564">Transport, schema and response failures count.</text><text x="753.94" y="187.988" fill="#000" font-size="13" textLength="314.279">Policy rejection and busy admission do not count.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="21"><path d="M6,419.198 L6,490.44 L319.151,490.44 L319.151,429.198 L309.151,419.198 L6,419.198" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M309.151,419.198 L309.151,429.198 L319.151,429.198 L309.151,419.198" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="12" y="436.767" fill="#000" font-size="13" textLength="292.151">An epoch prevents a late success from closing</text><text x="12" y="452.077" fill="#000" font-size="13" textLength="220.93">a circuit tripped by a newer failure.</text><text x="12" y="467.388" fill="#000" font-size="13" textLength="247.298">Separate generation and judge circuits.</text><text x="12" y="482.698" fill="#000" font-size="13" textLength="288.698">No retries or alternate-provider data transfer.</text></g><!--link *start* to Closed--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="3" data-link-type="dependency"><path d="M569.58,63.778 C569.58,77.478 569.58,98.818 569.58,120.348" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Closed"/><polygon points="569.58,125.348,573.58,116.348,569.58,120.348,565.58,116.348,569.58,125.348" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Closed to Open--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="6" data-link-type="dependency"><path d="M523.15,195.188 C491.49,218.428 453.75,246.139 422.08,269.389" style="stroke:#181818;stroke-width:1;" fill="none" id="Closed-to-Open"/><polygon points="418.05,272.348,427.672,270.247,422.08,269.389,422.938,263.798,418.05,272.348" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="477.51" y="239.297" fill="#000" font-size="13" textLength="158.336">failure threshold reached</text></g><!--link Open to HalfOpen--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="9" data-link-type="dependency"><path d="M445.75,342.628 C459.09,350.998 472.07,360.868 482.58,372.198 C495.07,385.668 502.431,399.237 508.761,415.037" style="stroke:#181818;stroke-width:1;" fill="none" id="Open-to-HalfOpen"/><polygon points="510.62,419.678,510.986,409.836,508.761,415.037,503.56,412.811,510.62,419.678" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="495.51" y="385.767" fill="#000" font-size="13" textLength="222.124">cooldown elapsed; first eligible call</text></g><!--link HalfOpen to Open--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk9" data-source-line="13" data-link-type="dependency"><path d="M419.69,433.998 C331.3,416.568 216.94,393.348 213.58,389.198 C192.9,363.728 212.068,347.178 246.998,334.548" style="stroke:#181818;stroke-width:1;" fill="none" id="HalfOpen-to-Open"/><polygon points="251.7,332.848,241.876,332.147,246.998,334.548,244.596,339.67,251.7,332.848" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="214.58" y="385.767" fill="#000" font-size="13" textLength="259.13">failure, slowness, timeout or cancellation</text></g><!--link HalfOpen to Closed--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk8" data-source-line="12" data-link-type="dependency"><path d="M623.47,446.698 C662.16,438.428 702.63,421.848 726.58,389.198 C776.18,321.548 689.278,243.055 626.328,198.085" style="stroke:#181818;stroke-width:1;" fill="none" id="HalfOpen-to-Closed"/><polygon points="622.26,195.178,627.258,203.665,626.328,198.085,631.908,197.155,622.26,195.178" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="741.58" y="312.537" fill="#000" font-size="13" textLength="238.24">probe healthy and within latency limit</text></g><!--link Open to GMN13--><g class="link" data-entity-1="ent0002" data-entity-2="ent0014" id="lnk15" data-source-line="21" data-link-type="association"><path d="M251.69,338.168 C232.36,346.828 213.74,357.948 198.58,372.198 C185.37,384.598 176.71,402.718 171.21,418.728" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Open-GMN13"/></g><g class="legend" data-source-line="26"><rect x="309.709" y="511.44" width="471.802" height="75.953" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="314.709" y="529.976" fill="#000" font-size="14" textLength="396.402">1. ContextStore: per-owner rate and one turn per session.</text><text x="314.709" y="546.464" fill="#000" font-size="14" textLength="375.095">2. Chatbot: global in-flight turn cap, no waiting queue.</text><text x="314.709" y="562.952" fill="#000" font-size="14" textLength="461.802">3. CircuitBreaker: role capacity, deadline, slow threshold, cooldown.</text><text x="314.709" y="579.44" fill="#000" font-size="14" textLength="451.801">All controls are process-local, not distributed traffic management.</text></g><?plantuml-src LLHBRzGm4BxdLymPxGO1jo8XbQfIEK0HvOOuJ9n9ujQnWptfTlyztoIRtVRKX-VnlIRgDGZT-EnchrIKLNRK2hV1Hod4iINDt7NU4RUZByMdM9Kd7oVEF58Pk4q77tlgE1If_hpxI_lz5xe9gKXRhJ_eYcuuXB9CKCK_ojmyYbFIH8udTbwFbzexuQ33aLmQfo2AXPIbY1Riy67EWfSvwjPWw-udYUZStdL0mv12YqPs0u2S2dx9ijOjQ0vUXpGhJJaz-rOoVNj_lnL-Jp5fYc3j4kQaGoGNadjQtstb7OVkL7mkaS0J87scpkUY-DFtle6yjgzwrN3xmax3aL8K87JfMVBHO3Jokke4Dka0R3P2ShcyNrH6wT9BmqauCyt8-KW1VaPtfE2X_Dlcjvhjg0HGa59sf7uK4oRPskWaO8hP3ac0r_S3dhhDuji5lC6ZWIqmnEKOdK_d5DNL0qPlTegPKgOKYyKBPhM-ECwjj7NrEtF4KrQWWMqZBrIsyWrgMVslgvyfU73BYquM4wjkvdAyH9NQH82zTGWAZCLAfKcgQJGkfaLr3GEdv0QeASyIaJTUz4DQdOCmr6LK8mO5UQ-OtEbeDFjf0gq6UodA0MwTa8Avs9rWHYzHCfzHFivjBzk4KbS_4cXW4CX1TTWeEQ9jVyvcoyfsYR5qabyH2TBRxokLwaDDDocglEY3fYm8XkIzsPffGM6hBNGwvsXl11DCfhhwYCw15NEkg0-fuK0-xhkmkBsKur1ts4a7zce7_s-M6Gm_rTlNuokExKdo5UMqP7wzwylNP8tOvJXtvyEfgsl4nm4vMjTKWBXfliVHSTWj7Y8eKAYPBKBRDsdaoBsCSZ9tLUC_?></g></svg>