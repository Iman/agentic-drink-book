<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1186px;height:966px;background:#FFFFFF;" width="1186px" height="966px" viewBox="0 0 1186 966" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="453.481" y="33.535" fill="#000" font-size="14" textLength="277.382" font-weight="700">Policy change and evaluation evidence</text></g><ellipse cx="644.71" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="509.724" y="92.488" width="269.973" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="519.724" y="114.09" fill="#000" font-size="12" textLength="249.973">Edit operator-owned policy or judge rubric</text><path d="M794.309,136.621 L794.309,160.587 L774.309,164.587 L794.309,168.587 L794.309,192.553 A0,0 0 0 0 794.309,192.553 L1165.344,192.553 A0,0 0 0 0 1165.344,192.553 L1165.344,146.621 L1155.344,136.621 L794.309,136.621 A0,0 0 0 0 794.309,136.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1155.344,136.621 L1155.344,146.621 L1165.344,146.621 L1155.344,136.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="800.309" y="154.189" fill="#000" font-size="13" textLength="350.035">Identity bypass; context disclosure; memory poisoning;</text><text x="800.309" y="169.5" fill="#000" font-size="13" textLength="276.225">prompt injection; offensive personalization;</text><text x="800.309" y="184.811" fill="#000" font-size="13" textLength="283.131">unsafe output; dependency failure; overload.</text><rect x="515.111" y="147.521" width="259.197" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="525.111" y="169.122" fill="#000" font-size="12" textLength="239.197">Review threat and consequence coverage</text><rect x="521.105" y="212.553" width="247.209" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="531.105" y="234.154" fill="#000" font-size="12" textLength="227.209">Run pytest security and resilience tests</text><rect x="513.052" y="266.686" width="263.316" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="523.052" y="288.287" fill="#000" font-size="12" textLength="243.316">Run Behave Gherkin acceptance scenarios</text><path d="M763.661,317.574 L763.661,333.885 L743.661,337.885 L763.661,341.885 L763.661,358.195 A0,0 0 0 0 763.661,358.195 L1079.51,358.195 A0,0 0 0 0 1079.51,358.195 L1079.51,327.574 L1069.51,317.574 L763.661,317.574 A0,0 0 0 0 763.661,317.574" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1069.51,317.574 L1069.51,327.574 L1079.51,327.574 L1069.51,317.574" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="769.661" y="335.143" fill="#000" font-size="13" textLength="239.618">Scripted evidence tests branch wiring.</text><text x="769.661" y="350.453" fill="#000" font-size="13" textLength="294.849">It does not measure model detection accuracy.</text><rect x="545.759" y="320.818" width="197.902" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="555.759" y="342.42" fill="#000" font-size="12" textLength="177.902">Run scripted offline evaluation</text><polygon points="590.698,378.195,698.722,378.195,710.722,390.195,698.722,402.195,590.698,402.195,578.698,390.195,590.698,378.195" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="590.698" y="394.353" fill="#000" font-size="11" textLength="108.023">Offline checks pass?</text><text x="561.215" y="387.875" fill="#000" font-size="11" textLength="17.483">yes</text><text x="710.722" y="387.875" fill="#000" font-size="11" textLength="13.583">no</text><rect x="211.806" y="412.195" width="226.186" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="221.806" y="433.797" fill="#000" font-size="12" textLength="206.186">Run synthetic live model evaluation</text><path d="M481.259,462.495 L481.259,486.461 L461.259,490.461 L481.259,494.461 L481.259,518.427 A0,0 0 0 0 481.259,518.427 L880.618,518.427 A0,0 0 0 0 880.618,518.427 L880.618,472.495 L870.618,462.495 L481.259,462.495 A0,0 0 0 0 481.259,462.495" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M870.618,462.495 L870.618,472.495 L880.618,472.495 L870.618,462.495" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="487.259" y="480.063" fill="#000" font-size="13" textLength="378.358">Expected outcomes are independent of online judge scores.</text><text x="487.259" y="495.374" fill="#000" font-size="13" textLength="316.742">Outages are failures, not successful attack blocks.</text><text x="487.259" y="510.685" fill="#000" font-size="13" textLength="358.674">Do not relabel cases to make a model appear successful.</text><rect x="188.539" y="466.328" width="272.721" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="198.539" y="487.93" fill="#000" font-size="12" textLength="199.641">Record policy and dataset digests,</text><text x="198.539" y="502.063" fill="#000" font-size="12" textLength="252.721">models, timestamps, outcomes and latency</text><rect x="171.567" y="538.427" width="306.664" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="181.567" y="560.028" fill="#000" font-size="12" textLength="232.834">Review false rejections, unsafe answers,</text><text x="181.567" y="574.161" fill="#000" font-size="12" textLength="286.664">multilingual cases and holdout adversarial inputs</text><polygon points="203.762,606.692,446.036,606.692,458.036,618.692,446.036,630.692,203.762,630.692,191.762,618.692,203.762,606.692" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="203.762" y="622.85" fill="#000" font-size="11" textLength="242.274">Owner accepts evidence and remaining risks?</text><text x="174.279" y="616.372" fill="#000" font-size="11" textLength="17.483">yes</text><text x="458.036" y="616.372" fill="#000" font-size="11" textLength="13.583">no</text><rect x="57.561" y="640.692" width="228.43" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="67.561" y="662.294" fill="#000" font-size="12" textLength="208.43">Release reviewed policy and lockfile</text><rect x="16" y="694.825" width="311.551" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="716.427" fill="#000" font-size="12" textLength="211.16">External deployment: signed review,</text><text x="26" y="730.56" fill="#000" font-size="12" textLength="291.551">canary, monitoring and rollback where configured</text><rect x="347.551" y="640.692" width="260.943" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="357.551" y="662.294" fill="#000" font-size="12" textLength="240.943">Revise controls or retain previous version</text><polygon points="324.899,749.091,336.899,761.091,324.899,773.091,312.899,761.091,324.899,749.091" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="900.618" y="412.195" width="127.807" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="910.618" y="433.797" fill="#000" font-size="12" textLength="107.807">Correct regression</text><polygon points="644.71,779.091,656.71,791.091,644.71,803.091,632.71,791.091,644.71,779.091" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="644.71" cy="834.091" rx=