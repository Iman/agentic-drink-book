t-size="14" textLength="116.614">Chatbot._commit</text><text x="396.75" y="967.152" fill="#000" font-size="14" textLength="180.489">host-owned memory write</text></g><g class="entity" data-qualified-name="GMN22" id="05-context-ent0023" data-source-line="26"><path d="M806.72,505.428 L806.72,576.67 A0,0 0 0 0 806.72,576.67 L1191.269,576.67 A0,0 0 0 0 1191.269,576.67 L1191.269,515.428 L1181.269,505.428 L991.35,505.428 L961.87,428.788 L983.35,505.428 L806.72,505.428 A0,0 0 0 0 806.72,505.428" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M1181.269,505.428 L1181.269,515.428 L1191.269,515.428 L1181.269,505.428" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="812.72" y="522.997" fill="#000" font-size="13" textLength="338.07">Source labels are assertions, not verified authenticity.</text><text x="812.72" y="538.307" fill="#000" font-size="13" textLength="330.154">SHA-256 identifies content, not truth or authorship.</text><text x="812.72" y="553.618" fill="#000" font-size="13" textLength="259.422">No URL fetching or cross-tenant sharing.</text><text x="812.72" y="568.928" fill="#000" font-size="13" textLength="363.549">Shared-document inspection requires no specialist route.</text></g><g class="entity" data-qualified-name="GMN25" id="05-context-ent0026" data-source-line="32"><path d="M6,505.428 L6,576.67 A0,0 0 0 0 6,576.67 L409.979,576.67 A0,0 0 0 0 409.979,576.67 L409.979,515.428 L399.979,505.428 L273.2,505.428 L403.26,428.788 L265.2,505.428 L6,505.428 A0,0 0 0 0 6,505.428" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M399.979,505.428 L399.979,515.428 L409.979,515.428 L399.979,505.428" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="12" y="522.997" fill="#000" font-size="13" textLength="245.578">Screened exchanges remain untrusted.</text><text x="12" y="538.307" fill="#000" font-size="13" textLength="382.979">Rejected inputs, drafts and judgments are not checkpointed.</text><text x="12" y="553.618" fill="#000" font-size="13" textLength="349.407">/reset deletes a session; TTL cleanup occurs on access.</text><text x="12" y="568.928" fill="#000" font-size="13" textLength="343.84">Process exit clears memory; TTL is not secure erasure.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="05-context-lnk11" data-source-line="14" data-link-type="dependency"><path d="M565.13,273.188 C556.08,282.728 546.53,293.088 537.99,302.958 C525.06,317.898 514.524,330.977 502.984,345.857" style="stroke:#181818;stroke-width:1;" fill="none" id="05-context-identity-to-sessions" /><polygon points="499.92,349.808,508.596,345.148,502.984,345.857,502.275,340.245,499.92,349.808" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="538.99" y="316.527" fill="#000" font-size="13" textLength="97.887">opaque session</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="05-context-lnk12" data-source-line="15" data-link-type="dependency"><path d="M948.99,119.678 C948.99,145.258 948.99,173.758 948.99,197.818" style="stroke:#181818;stroke-width:1;" fill="none" id="05-context-publisher-to-ingest" /><polygon points="948.99,202.818,952.99,193.818,948.99,197.818,944.99,193.818,948.99,202.818" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="949.99" y="163.037" fill="#000" font-size="13" textLength="211.098">bounded text + source + readers</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="05-context-lnk13" data-source-line="16" data-link-type="dependency"><path d="M948.99,266.568 C948.99,290.498 948.99,318.808 948.99,344.518" style="stroke:#181818;stroke-width:1;" fill="none" id="05-context-ingest-to-shared" /><polygon points="948.99,349.518,952.99,340.518,948.99,344.518,944.99,340.518,948.99,349.518" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="94