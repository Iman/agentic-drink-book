lygon points="1118.073,810.926,1128.073,814.926,1118.073,818.926,1122.073,814.926" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="1433.565" y1="283.02" x2="1433.565" y2="814.926" style="stroke:#181818;stroke-width:1;" /><line x1="1433.565" y1="814.926" x2="1152.073" y2="814.926" style="stroke:#181818;stroke-width:1;" /><polygon points="1162.073,810.926,1152.073,814.926,1162.073,818.926,1158.073,814.926" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="1140.073" y1="180.754" x2="1140.073" y2="200.754" style="stroke:#181818;stroke-width:1;" /><polygon points="1136.073,190.754,1140.073,200.754,1144.073,190.754,1140.073,194.754" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="1140.073" y1="826.926" x2="1140.073" y2="846.926" style="stroke:#181818;stroke-width:1;" /><polygon points="1136.073,836.926,1140.073,846.926,1144.073,836.926,1140.073,840.926" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><g class="legend" data-source-line="35"><rect x="463.318" y="889.926" width="639.398" height="125.418" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5" /><text x="468.318" y="908.461" fill="#000" font-size="14" textLength="564.669">Three calls on an ordinary accepted turn: input judge, one specialist, output judge.</text><text x="468.318" y="924.949" fill="#000" font-size="14" textLength="571.102">Errors, timeouts and invalid evidence stop processing; no draft streaming or retries.</text><text x="468.318" y="941.438" fill="#000" font-size="14" textLength="565.12">Post-run LLM audit belongs to synthetic evaluation, outside this live-chat function.</text><text x="468.318" y="957.926" fill="#000" font-size="14" textLength="629.398">Reset removes the current idle conversation; interface language does not change ownership.</text><text x="468.318" y="974.414" fill="#000" font-size="14" textLength="460.797">Model evidence can be incorrect even when every code gate passes.</text><text x="468.318" y="990.902" fill="#000" font-size="14" textLength="598.678">Known limits: incorrect recipes, audit false alarms and wrongly accepted refusal history.</text><text x="468.318" y="1007.391" fill="#000" font-size="14" textLength="549.042">Use diagram 03 for graph-node names and 09 for HTTP/session message order.</text></g><g class="footer" data-source-line="44"><text x="619.636" y="1038.012" fill="#888" font-size="10" textLength="326.763">Agentic Drink Book | Policy 2.1.0 | Model judgments remain fallible</text></g></g></svg>
