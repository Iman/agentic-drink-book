<svg xmlns="http://www.w3.org/2000/svg" version="1.1" data-diagram-type="ACTIVITY" style="width:1568px;height:1052px;background:#FFFFFF;" width="1568px" height="1052px" viewBox="0 0 1568 1052" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css" role="img" aria-labelledby="15-functional-flow-title 15-functional-flow-desc"><title id="15-functional-flow-title">Functional view: from a drinks question to a reviewed reply</title><desc id="15-functional-flow-desc">Functional view: from a drinks question to a reviewed reply. Boundaries describe application responsibilities; model judgments remain fallible.</desc><defs /><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="568.13" y="33.535" fill="#000" font-size="14" textLength="429.775" font-weight="700">Functional view: from a drinks question to a reviewed reply</text></g><ellipse cx="1140.073" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;" /><rect x="1018.467" y="92.488" width="243.213" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="1028.467" y="114.09" fill="#000" font-size="12" textLength="223.213">Receive an English or Persian question</text><rect x="1021.239" y="146.621" width="237.67" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="1031.239" y="168.223" fill="#000" font-size="12" textLength="217.67">Check caller, capacity and input rules</text><polygon points="1091.755,200.754,1188.392,200.754,1200.392,212.754,1188.392,224.754,1091.755,224.754,1079.755,212.754,1091.755,200.754" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="1091.755" y="216.911" fill="#000" font-size="11" textLength="96.637">Host checks pass?</text><text x="1062.272" y="210.434" fill="#000" font-size="11" textLength="17.483">yes</text><text x="1200.392" y="210.434" fill="#000" font-size="11" textLength="13.583">no</text><rect x="669.21" y="234.754" width="314.744" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="679.21" y="256.355" fill="#000" font-size="12" textLength="294.744">Load only authorized conversation and documents</text><rect x="694.593" y="303.02" width="263.979" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="704.593" y="324.621" fill="#000" font-size="12" textLength="243.979">Input judge reports risks, scope and topic</text><polygon points="725.484,357.152,927.679,357.152,939.679,369.152,927.679,381.152,725.484,381.152,713.484,369.152,725.484,357.152" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="725.484" y="373.31" fill="#000" font-size="11" textLength="202.195">Code accepts evidence and specialist?</text><text x="696.001" y="366.832" fill="#000" font-size="11" textLength="17.483">yes</text><text x="939.679" y="366.832" fill="#000" font-size="11" textLength="13.583">no</text><path d="M599.76,391.152 L599.76,422.773 L579.76,426.773 L599.76,430.773 L599.76,462.395 A0,0 0 0 0 599.76,462.395 L1024.256,462.395 A0,0 0 0 0 1024.256,462.395 L1024.256,401.152 L1014.256,391.152 L599.76,391.152 A0,0 0 0 0 599.76,391.152" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M1014.256,391.152 L1014.256,401.152 L1024.256,401.152 L1014.256,391.152" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="605.76" y="408.721" fill="#000" font-size="13" textLength="325.838">Mixing: cocktails, proportions, serving and storage.</text><text x="605.76" y="424.031" fill="#000" font-size="13" textLength="328.936">Production: fermentation, brewing, wine and spirits.</text><text x="605.76" y="439.342" fill="#000" font-size="13" textLength="403.495">Production also handles combined production/mixing requests.</text><text x="605.76" y="454.652" fill="#000" font-size="13" textLength="332.433">Neither specialist can delegate or grant permissions.</text><rect x="373.216" y="409.707" width="206.545" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="383.216" y="431.309" fill="#000" font-size="12" textLength="186.545">One specialist drafts the answer</text><rect x="402.665" y="482.395" width="147.646" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="412.665" y="503.996" fill="#000" font-size="12" textLength="127.646">Screen the exact draft</text><polygon points="426.784,536.527,526.192,536.527,538.192,548.527,526.192,560.527,426.784,560.527,414.784,548.527,426.784,536.527" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="426.784" y="552.685" fill="#000" font-size="11" textLength="99.408">Output rules pass?</text><text x="397.301" y="546.207" fill="#000" font-size="11" textLength="17.483">yes</text><text x="538.192" y="546.207" fill="#000" font-size="11" textLength="13.583">no</text><rect x="134.943" y="570.527" width="291.6" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="144.943" y="592.129" fill="#000" font-size="12" textLength="271.6">Output judge reports scope, safety and quality</text><polygon points="198.331,624.66,363.154,624.66,375.154,636.66,363.154,648.66,198.331,648.66,186.331,636.66,198.331,624.66" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="198.331" y="640.817" fill="#000" font-size="11" textLength="164.823">Code accepts output evidence?</text><text x="168.848" y="634.34" fill="#000" font-size="11" textLength="17.483">yes</text><text x="375.154" y="634.34" fill="#000" font-size="11" textLength="13.583">no</text><rect x="16" y="658.66" width="263.492" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="26" y="680.262" fill="#000" font-size="12" textLength="243.492">Recheck owner, store accepted exchange,</text><text x="26" y="694.395" fill="#000" font-size="12" textLength="181.266">then display the reviewed reply</text><rect x="299.492" y="658.66" width="228.494" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="309.492" y="680.262" fill="#000" font-size="12" textLength="208.494">Discard draft; display static fallback</text><polygon points="280.743,712.926,292.743,724.926,280.743,736.926,268.743,724.926,280.743,712.926" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><rect x="557.986" y="570.527" width="228.494" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="567.986" y="592.129" fill="#000" font-size="12" textLength="208.494">Discard draft; display static fallback</text><polygon points="476.488,742.926,488.488,754.926,476.488,766.926,464.488,754.926,476.488,742.926" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><rect x="1044.256" y="391.152" width="264.84" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="1054.256" y="412.754" fill="#000" font-size="12" textLength="187.072">Display refusal, neutral greeting</text><text x="1054.256" y="426.887" fill="#000" font-size="12" textLength="244.84">or unavailable response; no memory write</text><polygon points="826.582,772.926,838.582,784.926,826.582,796.926,814.582,784.926,826.582,772.926" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><rect x="1319.095" y="234.754" width="228.939" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="1329.095" y="256.355" fill="#000" font-size="12" textLength="208.939">Return a static refusal, neutral reply</text><text x="1329.095" y="270.488" fill="#000" font-size="12" textLength="198.668">or boundary error; no model work</text><polygon points="1140.073,802.926,1152.073,814.926,1140.073,826.926,1128.073,814.926,1140.073,802.926" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><ellipse cx="1140.073" cy="857.926" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;" /><ellipse cx="1140.073" cy="857.926" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;" /><line x1="1140.073" y1="72.488" x2="1140.073" y2="92.488" style="stroke:#181818;stroke-width:1;" /><polygon points="1136.073,82.488,1140.073,92.488,1144.073,82.488,1140.073,86.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="1140.073" y1="126.621" x2="1140.073" y2="146.621" style="stroke:#181818;stroke-width:1;" /><polygon points="1136.073,136.621,1140.073,146.621,1144.073,136.621,1140.073,140.621" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="826.582" y1="268.887" x2="826.582" y2="303.02" style="stroke:#181818;stroke-width:1;" /><polygon points="822.582,293.02,826.582,303.02,830.582,293.02,826.582,297.02" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="476.488" y1="443.84" x2="476.488" y2="482.395" style="stroke:#181818;stroke-width:1;" /><polygon points="472.488,472.395,476.488,482.395,480.488,472.395,476.488,476.395" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="186.331" y1="636.66" x2="147.746" y2="636.66" style="stroke:#181818;stroke-width:1;" /><line x1="147.746" y1="636.66" x2="147.746" y2="658.66" style="stroke:#181818;stroke-width:1;" /><polygon points="143.746,648.66,147.746,658.66,151.746,648.66,147.746,652.66" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:mite