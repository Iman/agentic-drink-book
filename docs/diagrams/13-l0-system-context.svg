806.461,428.597 C814.164,429.026 816.503,434.763 811.642,440.611 C815.221,445.932 813.204,451.1 806.549,451.737 C809.711,457.401 808.678,461.459 801.869,462.967 C799.262,469.814 795.322,469.97 790.589,464.996 C787.878,471.017 782.541,470.333 779.055,465.847 C775.27,472.104 769.859,473.587 765.477,466.452 C763.301,472.14 759.459,474.255 754.321,469.668 C750.633,474.416 746.339,475.109 742.756,469.549 C740.045,475.637 735.789,476.931 730.471,472.631 C726.47,479.608 722.395,479.325 717.955,473.045 C712.999,479.55 708.588,477.907 704.511,472.088 C700.028,477.339 695.613,475.775 693.025,470.097 C689.109,475.42 683.048,475.362 680.619,468.572 C676.96,473.467 672.994,473.846 669.616,468.277 C664.253,473.688 660.209,473.504 656.28,466.71 C651.957,471.674 647.088,469.864 644.668,464.558 C640.093,469.518 636.233,468.36 633.397,462.709 C627.191,460.039 625.782,455.446 630.84,450.43 C625.268,447.921 623.954,443.844 628.858,439.445 C623.143,435.221 623.526,430.333 629.973,427.217 C626.028,421.993 625.529,417.907 632.783,415.329" style="stroke:#181818;stroke-width:0.5;" fill="#FBE9E4" /><text x="638.42" y="435.703" fill="#000" font-size="14" textLength="75.729">OpenAI API</text><text x="638.42" y="452.192" fill="#000" font-size="14" textLength="156.447">explicit cloud selection</text></g><g class="entity" data-qualified-name="GMN14" id="13-l0-system-context-ent0015" data-source-line="21"><path d="M6,257.818 L6,329.06 A0,0 0 0 0 6,329.06 L375.29,329.06 A0,0 0 0 0 375.29,329.06 L375.29,297.438 L410.18,293.438 L375.29,289.438 L375.29,267.818 L365.29,257.818 L6,257.818 A0,0 0 0 0 6,257.818" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M365.29,257.818 L365.29,267.818 L375.29,267.818 L365.29,257.818" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="12" y="275.387" fill="#000" font-size="13" textLength="293.579">Scope: cocktails, ingredients, serving, storage,</text><text x="12" y="290.697" fill="#000" font-size="13" textLength="325.819">fermentation, brewing, wine and spirits production.</text><text x="12" y="306.008" fill="#000" font-size="13" textLength="290.513">Unrelated requests must be refused by policy.</text><text x="12" y="321.318" fill="#000" font-size="13" textLength="348.29">English / Persian presentation; Persian interface is RTL.</text></g><g class="entity" data-qualified-name="GMN17" id="13-l0-system-context-ent0018" data-source-line="27"><path d="M820.37,257.818 L820.37,289.438 L785.33,293.438 L820.37,297.438 L820.37,329.06 A0,0 0 0 0 820.37,329.06 L1270.916,329.06 A0,0 0 0 0 1270.916,329.06 L1270.916,267.818 L1260.916,257.818 L820.37,257.818 A0,0 0 0 0 820.37,257.818" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M1260.916,257.818 L1260.916,267.818 L1270.916,267.818 L1260.916,257.818" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="826.37" y="275.387" fill="#000" font-size="13" textLength="338.908">Four runtime LLM roles; three calls per accepted turn.</text><text x="826.37" y="290.697" fill="#000" font-size="13" textLength="342.748">A fifth role audits synthetic evaluations when enabled.</text><text x="826.37" y="306.008" fill="#000" font-size="13" textLength="344.271">Code owns permissions, routing, memory and release.</text><text x="826.37" y="321.318" fill="#000" font-size="13" textLength="429.546">Incorrect recipes and accepted-refusal retention are known failures.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="13-l0-system-context-lnk9" data-source-line="15" data-link-type="dependency"><path d="M456.57,160.858 C489.23,191.318 527.814,227.308 557.524,255.018" style="stroke:#181818;stroke-width:1;" fill="none" id="13-l0-system-context-learner-to-application" /><polygon points="561.18,258.428,557.327,249.365,557.524,255.018,551.87,255.215,561.18,258.428" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="503.64" y="204.277" fill="#000" font-size="13" textLength="73.474">ASK / READ</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="13-l0-system-context-lnk10" data-source-line="16" data-link-type="dependency"><path d="M597.64,160.858 C597.64,191.318 597.64,225.718 597.64,253.428" style="stroke:#181818;stroke-width:1;" fill="none" id="13-l0-system-context-operator-to-application" /><polygon points="597.64,258.428,601.64,249.428,597.64,253.428,593.64,249.428,597.64,258.428" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="598.64" y="204.277" fill="#000" font-size="13" textLength="73.081">CONFIGURE</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="13-l0-system-context-lnk11" data-source-line="17" data-link-type="dependency"><path d="M569.21,328.378 C549.25,352.208 525.982,379.966 506.632,403.056" style="stroke:#181818;stroke-width:1;" fill="none" id="13-l0-system-context-application-to-local" /><polygon points="503.42,406.888,512.267,402.559,506.632,403.056,506.135,397.421,503.42,406.888" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="542.24" y="373.737" fill="#000" font-size="13" textLength="84.119">LOCAL MODE</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="13-l0-system-context-lnk12" data-source-line="18" data-link-type="dependency"><path d="M625.85,328.378 C645.64,352.208 668.705,379.952 687.885,403.042" style="stroke:#181818;stroke-width:1;" fill="none" id="13-l0-system-context-application-to-cloud" /><polygon points="691.08,406.888,688.406,397.409,687.885,403.042,682.252,402.521,691.08,406.888" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="665.27" y="373.737" fill="#000" font-size="13" textLength="86.963">CLOUD MODE</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0004" id="13-l0-system-context-lnk13" data-source-line="19" data-link-type="dependency"><path d="M875.32,149.388 C814.5,180.718 729.355,224.588 668.505,255.938" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="13-l0-system-context-external-to-application" /><polygon points="664.06,258.228,673.893,257.662,668.505,255.938,670.229,250.551,664.06,258.228" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="791.24" y="204.277" fill="#000" font-size="13" textLength="114.715">BEFORE EXPOSURE</text></g><g class="legend" data-source-line="32"><rect x="364.753" y="501.145" width="549.41" height="92.441" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5" /><text x="369.753" y="519.68" fill="#000" font-size="14" textLength="530.024">Solid arrows: supported interactions. Dashed arrow: deployment requirement.</text><text x="369.753" y="536.168" fill="#000" font-size="14" textLength="458.514">Exactly one provider mode is selected; no automatic cloud fallback.</text><text x="369.753" y="552.657" fill="#000" font-size="14" textLength="407.9">Cookies identify local browser sessions, not verified people.</text><text x="369.753" y="569.145" fill="#000" font-size="14" textLength="496.528">Model observations and audit findings can be wrong; no immunity claim.</text><text x="369.753" y="585.633" fill="#000" font-size="14" textLength="539.41">L0 is this repository's system-context view. Internal components are in L1 (14).</text></g><g class="footer" data-source-line="39"><text x="476.077" y="616.254" fill="#888" font-size="10" textLength="326.763">Agentic Drink Book | Policy 2.1.0 | Model judgments remain fallible</text></g></g></svg>
