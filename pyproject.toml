[project]
name = "agentic-chat"
version = "0.1.0"
description = "A policy-gated LangGraph chatbot and security teaching lab"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "pydantic>=2,<3",
    "httpx>=0.28,<1",
    "langsmith>=0.14,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
agentic-chat = "agentic_chat.cli:main"
agentic-eval = "agentic_chat.evaluation:main"
agentic-web = "agentic_chat.web:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "behave>=1.3,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
