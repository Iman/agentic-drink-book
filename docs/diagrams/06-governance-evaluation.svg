<svg xmlns="http://www.w3.org/2000/svg" version="1.1" data-diagram-type="ACTIVITY" style="width:1269px;height:1236px;background:#FFFFFF;" width="1269px" height="1236px" viewBox="0 0 1269 1236" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css" role="img" aria-labelledby="06-governance-evaluation-title 06-governance-evaluation-desc"><title id="06-governance-evaluation-title">Policy change and evaluation evidence</title><desc id="06-governance-evaluation-desc">Policy change and evaluation evidence. Boundaries describe application responsibilities; model judgments remain fallible.</desc><defs /><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="495.159" y="33.535" fill="#000" font-size="14" textLength="277.382" font-weight="700">Policy change and evaluation evidence</text></g><ellipse cx="728.066" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;" /><rect x="593.08" y="92.488" width="269.973" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="603.08" y="114.09" fill="#000" font-size="12" textLength="249.973">Edit operator-owned policy or judge rubric</text><path d="M877.665,136.621 L877.665,160.587 L857.665,164.587 L877.665,168.587 L877.665,192.553 A0,0 0 0 0 877.665,192.553 L1248.7,192.553 A0,0 0 0 0 1248.7,192.553 L1248.7,146.621 L1238.7,136.621 L877.665,136.621 A0,0 0 0 0 877.665,136.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M1238.7,136.621 L1238.7,146.621 L1248.7,146.621 L1238.7,136.621" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="883.665" y="154.189" fill="#000" font-size="13" textLength="350.035">Identity bypass; context disclosure; memory poisoning;</text><text x="883.665" y="169.5" fill="#000" font-size="13" textLength="276.225">prompt injection; offensive personalization;</text><text x="883.665" y="184.811" fill="#000" font-size="13" textLength="283.131">unsafe output; dependency failure; overload.</text><rect x="598.468" y="147.521" width="259.197" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="608.468" y="169.122" fill="#000" font-size="12" textLength="239.197">Review threat and consequence coverage</text><rect x="604.462" y="212.553" width="247.209" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="614.462" y="234.154" fill="#000" font-size="12" textLength="227.209">Run pytest security and resilience tests</text><rect x="596.408" y="266.686" width="263.316" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="606.408" y="288.287" fill="#000" font-size="12" textLength="243.316">Run Behave Gherkin acceptance scenarios</text><path d="M847.018,317.574 L847.018,333.885 L827.018,337.885 L847.018,341.885 L847.018,358.195 A0,0 0 0 0 847.018,358.195 L1162.866,358.195 A0,0 0 0 0 1162.866,358.195 L1162.866,327.574 L1152.866,317.574 L847.018,317.574 A0,0 0 0 0 847.018,317.574" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M1152.866,317.574 L1152.866,327.574 L1162.866,327.574 L1152.866,317.574" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="853.018" y="335.143" fill="#000" font-size="13" textLength="239.618">Scripted evidence tests branch wiring.</text><text x="853.018" y="350.453" fill="#000" font-size="13" textLength="294.849">It does not measure model detection accuracy.</text><rect x="629.115" y="320.818" width="197.902" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="639.115" y="342.42" fill="#000" font-size="12" textLength="177.902">Run scripted offline evaluation</text><polygon points="674.055,378.195,782.078,378.195,794.078,390.195,782.078,402.195,674.055,402.195,662.055,390.195,674.055,378.195" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="674.055" y="394.353" fill="#000" font-size="11" textLength="108.023">Offline checks pass?</text><text x="644.572" y="387.875" fill="#000" font-size="11" textLength="17.483">yes</text><text x="794.078" y="387.875" fill="#000" font-size="11" textLength="13.583">no</text><rect x="264.861" y="412.195" width="226.186" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="274.861" y="433.797" fill="#000" font-size="12" textLength="206.186">Run synthetic live model evaluation</text><path d="M534.314,462.495 L534.314,486.461 L514.314,490.461 L534.314,494.461 L534.314,518.427 A0,0 0 0 0 534.314,518.427 L933.673,518.427 A0,0 0 0 0 933.673,518.427 L933.673,472.495 L923.673,462.495 L534.314,462.495 A0,0 0 0 0 534.314,462.495" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M923.673,462.495 L923.673,472.495 L933.673,472.495 L923.673,462.495" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="540.314" y="480.063" fill="#000" font-size="13" textLength="378.358">Expected outcomes are independent of online judge scores.</text><text x="540.314" y="495.374" fill="#000" font-size="13" textLength="316.742">Outages are failures, not successful attack blocks.</text><text x="540.314" y="510.685" fill="#000" font-size="13" textLength="358.674">Do not relabel cases to make a model appear successful.</text><rect x="241.594" y="466.328" width="272.721" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="251.594" y="487.93" fill="#000" font-size="12" textLength="199.641">Record policy and dataset digests,</text><text x="251.594" y="502.063" fill="#000" font-size="12" textLength="252.721">models, timestamps, outcomes and latency</text><rect x="232.09" y="586.904" width="291.729" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="242.09" y="608.506" fill="#000" font-size="12" textLength="271.729">Audit bounded synthetic request, visible reply,</text><text x="242.09" y="622.639" fill="#000" font-size="12" textLength="232.834">executed stages and reference evidence</text><path d="M574.885,661.182 L574.885,692.803 L554.885,696.803 L574.885,700.803 L574.885,732.424 A0,0 0 0 0 574.885,732.424 L972.275,732.424 A0,0 0 0 0 972.275,732.424 L972.275,671.182 L962.275,661.182 L574.885,661.182 A0,0 0 0 0 574.885,661.182" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><path d="M962.275,661.182 L962.275,671.182 L972.275,671.182 L962.275,661.182" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD" /><text x="580.885" y="678.75" fill="#000" font-size="13" textLength="236.253">Separate auditor circuit and deadline.</text><text x="580.885" y="694.061" fill="#000" font-size="13" textLength="376.391">Missing evidence means inconclusive; failure is unavailable.</text><text x="580.885" y="709.371" fill="#000" font-size="13" textLength="358.763">Do not expose discarded drafts or private conversations.</text><text x="580.885" y="724.682" fill="#000" font-size="13" textLength="305.462">Findings never rewrite expected labels or policy.</text><rect x="201.023" y="679.736" width="353.861" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="211.023" y="701.338" fill="#000" font-size="12" textLength="333.861">Validate case ID, finding schema and evidence references</text><polygon points="298.843,538.427,457.065,538.427,469.065,550.427,457.065,562.427,298.843,562.427,286.843,550.427,298.843,538.427" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="381.954" y="573.062" fill="#000" font-size="11" textLength="17.483">yes</text><text x="298.843" y="554.584" fill="#000" font-size="11" textLength="158.222">Explicit audit model selected?</text><polygon points="377.954,752.424,389.954,764.424,377.954,776.424,365.954,764.424,377.954,752.424" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><rect x="224.622" y="796.424" width="306.664" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="234.622" y="818.025" fill="#000" font-size="12" textLength="232.834">Review false rejections, unsafe answers,</text><text x="234.622" y="832.158" fill="#000" font-size="12" textLength="286.664">multilingual cases and holdout adversarial inputs</text><polygon points="256.817,864.689,499.091,864.689,511.091,876.689,499.091,888.689,256.817,888.689,244.817,876.689,256.817,864.689" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><text x="256.817" y="880.847" fill="#000" font-size="11" textLength="242.274">Owner accepts evidence and remaining risks?</text><text x="227.334" y="874.369" fill="#000" font-size="11" textLength="17.483">yes</text><text x="511.091" y="874.369" fill="#000" font-size="11" textLength="13.583">no</text><rect x="16" y="898.689" width="382.291" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="26" y="920.291" fill="#000" font-size="12" textLength="362.291">Commit reviewed implementation, policy, fixtures and lockfile</text><rect x="51.37" y="952.822" width="311.551" height="48.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="61.37" y="974.424" fill="#000" font-size="12" textLength="211.16">External deployment: signed review,</text><text x="61.37" y="988.557" fill="#000" font-size="12" textLength="291.551">canary, monitoring and rollback where configured</text><rect x="418.291" y="898.689" width="260.943" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="428.291" y="920.291" fill="#000" font-size="12" textLength="240.943">Revise controls or retain previous version</text><polygon points="377.954,1007.088,389.954,1019.088,377.954,1031.088,365.954,1019.088,377.954,1007.088" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><rect x="1014.275" y="412.195" width="127.807" height="34.133" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5" /><text x="1024.275" y="433.797" fill="#000" font-size="12" textLength="107.807">Correct regression</text><polygon points="728.066,1037.088,740.066,1049.088,728.066,1061.088,716.066,1049.088,728.066,1037.088" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;" /><ellipse cx="728.066" cy="1092.088" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;" /><ellipse cx="728.066" cy="1092.088" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;" /><line x1="728.066" y1="72.488" x2="728.066" y2="92.488" style="stroke:#181818;stroke-width:1;" /><polygon points="724.066,82.488,728.066,92.488,732.066,82.488,728.066,86.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="728.066" y1="126.621" x2="728.066" y2="147.521" style="stroke:#181818;stroke-width:1;" /><polygon points="724.066,137.521,728.066,147.521,732.066,137.521,728.066,141.521" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="728.066" y1="181.653" x2="728.066" y2="212.553" style="stroke:#181818;stroke-width:1;" /><polygon points="724.066,202.553,728.066,212.553,732.066,202.553,728.066,206.553" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="728.066" y1="246.686" x2="728.066" y2="266.686" style="stroke:#181818;stroke-width:1;" /><polygon points="724.066,256.686,728.066,266.686,732.066,256.686,728.066,260.686" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;" /><line x1="728.066" y1="300.818" x2="728.066" y2="320.818" style="stroke:#181818;stroke-w