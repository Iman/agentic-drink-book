<svg xmlns="http://www.w3.org/2000/svg" version="1.1" data-diagram-type="DESCRIPTION" style="width:1285px;height:625px;background:#FFFFFF;" width="1285px" height="625px" viewBox="0 0 1285 625" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css" role="img" aria-labelledby="13-l0-system-context-title 13-l0-system-context-desc"><title id="13-l0-system-context-title">L0 system context: people, application and model services</title><desc id="13-l0-system-context-desc">L0 system context: people, application and model services. Boundaries describe application responsibilities; model judgments remain fallible.</desc><defs /><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="429.458" y="23.535" fill="#000" font-size="14" textLength="420" font-weight="700">L0 system context: people, application and model services</text></g><g class="cluster" data-qualified-name="Application boundary . local teaching project" id="13-l0-system-context-ent0003" data-source-line="7"><rect x="394.64" y="223.708" width="406" height="120.46" fill="#E8F0FA" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5" /><text x="433.803" y="239.243" fill="#000" font-size="14" textLength="327.674" font-weight="700">Application boundary / local teaching project</text></g><g class="cluster" data-qualified-name="Public deployment requirements . not implemented here" id="13-l0-system-context-ent0007" data-source-line="12"><rect x="711.64" y="44.488" width="460" height="120.46" fill="#FFF0D9" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5" /><text x="736.111" y="60.023" fill="#000" font-size="14" textLength="411.059" font-weight="700">Public deployment requirements / not implemented here</text></g><g class="entity" data-qualified-name="Application boundary . local teaching project.application" id="13-l0-system-context-ent0004" data-source-line="8"><rect x="410.34" y="258.708" width="374.614" height="69.465" fill="#EDF7ED" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="420.34" y="282.243" fill="#000" font-size="14" textLength="130.758">Agentic Drink Book</text><text x="420.34" y="298.732" fill="#000" font-size="14" textLength="262.63">React web interface or Python terminal</text><text x="420.34" y="315.22" fill="#000" font-size="14" textLength="354.614">drinks questions, reviewed replies and session reset</text></g><g class="entity" data-qualified-name="Public deployment requirements . not implemented here.external" id="13-l0-system-context-ent0008" data-source-line="13"><rect x="727.56" y="79.488" width="428.16" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5" /><text x="737.56" y="103.023" fill="#000" font-size="14" textLength="296.646">Verified user identity, TLS and shared limits</text><text x="737.56" y="119.512" fill="#000" font-size="14" textLength="408.16">host isolation, restricted egress and protected audit storage</text><text x="737.56" y="136" fill="#000" font-size="14" textLength="269.418">incident response and policy ownership</text></g><g class="entity" data-qualified-name="learner" id="13-l0-system-context-ent0001" data-source-line="5"><ellipse cx="407.641" cy="76.228" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" /><path d="M407.641,84.228 L407.641,111.228 M394.641,92.228 L420.641,92.228 M407.641,111.228 L394.641,126.228 M407.641,111.228 L420.641,126.228" style="stroke:#181818;stroke-width:0.5;" fill="none" /><text x="347.15" y="141.263" fill="#000" font-size="14" textLength="89.086">Drink learner</text><text x="347.15" y="157.752" fill="#000" font-size="14" textLength="120.982">English or Persian</text></g><g class="entity" data-qualified-name="operator" id="13-l0-system-context-ent0002" data-source-line="6"><ellipse cx="597.645" cy="76.228" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" /><path d="M597.645,84.228 L597.645,111.228 M584.645,92.228 L610.645,92.228 M597.